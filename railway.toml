# ─────────────────────────────────────────────────────────────
# railway.toml — Railway deployment configuration
# ─────────────────────────────────────────────────────────────

[build]
builder            = "DOCKERFILE"
dockerfilePath     = "Dockerfile"

[deploy]
healthcheckPath    = "/"
healthcheckTimeout = 30
restartPolicyType  = "ON_FAILURE"
restartPolicyMaxRetries = 3
